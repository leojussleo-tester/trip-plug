<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trip Plug – Exotic Hotwheels</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
    <div class="header-inner">
        <div class="logo-area">
            <img src="logo.png" alt="Trip Plug">
            <span>TRIP PLUG</span>
        </div>

        <nav class="main-nav">
            <a href="#" data-filter="ALL">Tất cả</a>
            <a href="#" data-filter="LIMITED">Limited</a>
            <a href="#" data-filter="CUSTOM">Custom</a>
            <a href="#contact">Liên hệ</a>
        </nav>

        <div class="search-box">
            <input id="searchInput" type="text" placeholder="Tìm sản phẩm...">
        </div>
    </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero fade">
    <img src="logo.png" class="logo">
    <h1>TRIP PLUG</h1>
    <p>Exotic · Limited · Japan Culture</p>
    <a href="#products" class="btn-primary">Xem sản phẩm</a>
</section>

<!-- ================= PRODUCTS ================= -->
<section id="products" class="product">
    <h2>Sản Phẩm Nổi Bật</h2>
    <div class="product-grid"></div>
</section>

<!-- ================= CONTACT ================= -->
<section id="contact" class="contact fade">
    <h2>Liên hệ</h2>
    <p>Trip Plug – Exotic Hotwheels</p>
    <p>📞 0900 000 000</p>
    <p>📧 tripplug@gmail.com</p>
    <p>📍 TP. Hồ Chí Minh</p>
</section>

<footer class="site-footer">
    <p>© 2026 Trip Plug</p>
</footer>

<!-- ================= PRODUCT MODAL ================= -->
<div id="productModal" class="modal">
    <div class="modal-overlay"></div>

    <div class="modal-content">
        <button class="modal-close">&times;</button>
        <img id="modalImage">
        <h3 id="modalName"></h3>
        <p id="modalType"></p>
        <button class="btn-primary">Liên hệ đặt hàng</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
